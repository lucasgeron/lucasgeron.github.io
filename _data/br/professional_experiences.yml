  projects:
    - 
      id: sentrel
      product:
        name: Sentrel
        website: 
          url: http://sentrel.com/
          label: sentrel.com
        logo: 
          light: https://raw.githubusercontent.com/lucasgeron/lucasgeron/a0bc1d88105412568c0de6f822c4ff5a1e2d477a/public/assets/images/sentrel-logo.svg
          dark: https://raw.githubusercontent.com/lucasgeron/lucasgeron/a0bc1d88105412568c0de6f822c4ff5a1e2d477a/public/assets/images/sentrel-logo.svg
      position: Engenheiro de Software
      main_stack: Ruby on Rails, Python
      mode: Remoto
      location: 
        city: Nova York
        state: NY
        country: EUA
      start_date: Setembro 2025
      end_date: Dezembro 2025
      duration: 4 meses
      about_the_project: >
        Sentrel é uma solução que integra agentes de IA em organizações governamentais. O foco
        do produto consiste em receber ligações telefônicas e através de um agente de IA,
        oferecer suporte às questões solicitadas com acesso a informações internas e capacidade
        de responder apropriadamente, coletar dados relevantes, criar demandas, enviar
        notificações e escalar para os setores responsáveis quando apropriado.
      about_the_experience: >
        Na Sentrel, trabalhei na equipe de engenharia e desenvolvimento full stack, participando
        ativamente das decisões sobre a arquitetura da aplicação, incluindo tecnologias, esquema
        de banco de dados, serviços de hospedagem e monitoramento, além de coordenar tarefas e
        demandas de desenvolvimento para a equipe. A aplicação foi do zero à implantação em
        produção em pouco mais de um mês.
      main_contributions: 
        - 
          title: Dashboard real-time sem reload
          content: > 
            Assim como o layout principal da aplicação, desenvolvi as principais páginas da
            aplicação com atualizações em tempo real, utilizando hotwire, a dashboard de
            ligações, assim como a transcrição das chamadas em curso eram atualizadas sem
            precisar recarregar a página.
        - 
          title: Recursos para o agente usar RAG
          content: > 
            Implementei a funcionalidade do agente de consumir informações utilizando RAG
            (Retrieval Augmented Generation). O fluxo de pesquisa utilizava keywords para
            auxiliar na busca e entregava informações com uma assertividade muito alta.
        - 
          title: Componentização de UI
          content: > 
            Utilizando View Components em uma aplicação Rails (monolito), criei uma série de
            componentes para padronizar a interface e tornar o desenvolvimento mais ágil.
        - 
          title: Envio de SMS sob demanda
          content: > 
            Através da integração com o Twilio, implementamos a capacidade de enviar informações
            limitadas como endereços, telefones, emails e links por SMS.
        - 
          title: Ambientes de Playground e Sandbox
          content: > 
            Com o core da aplicação sendo através de uma chamada telefônica, desenvolvi um
            ambiente de playground, onde era possível falar com o agente por texto, ou ligar
            para o mesmo antes de colocá-lo em produção. O ambiente de sandbox também foi
            configurado com integração aos serviços parceiros, permitindo chamada de funções,
            consulta de bases de conhecimentos e uso de credenciais próprias.
        - 
          title: Deployment e CI/CD em múltiplos ambientes
          content: > 
            Desenvolvi o workflow de CI/CD para o Github e Heroku, automatizando o processo de
            deploy. O processo contava com verificação de testes (Rspec), qualidade de código
            (Rubocop), vulnerabilidades (Brakeman e Audit) e relatório de cobertura
            (SimpleCov).
        - 
          title: Relatórios e Métricas de uso
          content: > 
            Com todos os dados na aplicação, pude desenvolver a visualização das métricas,
            contando com gráficos de heatmap de chamadas por hora do dia, e dias da semana,
            ranking dos principais assuntos abordados nas chamadas, volume de ligações por
            departamento e quantas das chamadas eram resolvidas por AI, e quantas eram
            escaladas com base em diversos filtros.
        - 
          title: Multi-configuração dos Agentes
          content: > 
            Como cada cliente poderia optar por qual recurso iria utilizar para TTS
            (Text-to-speech), LLM (Large Language Model) e SST (Speech-to-text), e cada agente
            tinha acesso a seu próprio set de ferramentas, estruturei uma forma de orquestrar
            essas informações com qualidade.
    - 
      id: vanta
      product:
        name: Vanta
        website: 
          url: https://www.vantaesports.com/
          label: vantaesports.com
        logo: 
          light: https://raw.githubusercontent.com/lucasgeron/lucasgeron/02420f8c5e7d3d2f3c0191f6bc9a155807e0ab51/public/assets/images/vanta-logo.svg
          dark: https://raw.githubusercontent.com/lucasgeron/lucasgeron/02420f8c5e7d3d2f3c0191f6bc9a155807e0ab51/public/assets/images/vanta-logo.svg
      position: Desenvolvedor Full Stack
      main_stack: Ruby on Rails, React
      mode: Remoto
      location: 
        city: Boston
        state: MA
        country: EUA
      start_date: Abril 2024
      end_date: Agosto 2024
      duration: 1 ano, 5 meses
      about_the_project: >
        Vanta é uma plataforma especializada em coaching de e-sports para escolas e que também
        promove campeonatos de diversas modalidades e jogos entre ligas locais, estaduais e
        nacionais, a aplicação conta com um ambiente virtual que permite streaming dos jogadores
        e suas gameplays simultaneamente.
      about_the_experience: >
        Na Vanta eu trabalhei principalmente como desenvolvedor back-end com contribuições
        frequentes para o front-end.
      main_contributions: 
        - 
          title: Integração Verizon Innovative Learning
          content: > 
            Desenvolvi uma API semelhante ao OAuth para vincular com segurança contas de
            usuários com integração VIL com suas contas Vanta, permitindo acesso exclusivo a
            ligas patrocinadas pela Verizon.
        - 
          title: Sistema de Check-in
          content: > 
            Implementei o backend para o processo de check-in das partidas, que incluía
            lembretes automatizados e notificações em tempo real para os usuários. Este sistema
            reduziu significativamente o número de desistências, melhorando o engajamento geral
            e a confiabilidade da plataforma.
        - 
          title: Redesign da página de Eventos
          content: > 
            Fui responsável por implementar a nova experiência de navegação de eventos com base
            nos layouts fornecidos pela equipe de design no Figma. Meu trabalho se concentrou em
            traduzir os conceitos visuais em uma interface totalmente responsiva e intuitiva,
            garantindo consistência em todos os dispositivos.
        - 
          title: Marketplace
          content: > 
            Criei um módulo de marketplace flexível onde itens e conteúdo podiam ser gerenciados
            por meio de arquivos YAML, permitindo atualizações rápidas sem alterações no código.
            Os produtos são gerenciados pela equipe de marketing por meio do painel
            administrativo, facilitando o lançamento de novas ofertas. O marketplace foi
            integrado ao HubSpot para rastreamento de compras e gerenciamento de pedidos,
            simplificando o processo de vendas para usuários e administradores.
        - 
          title: Melhorias na Arena
          content: > 
            Implementei recursos avançados no módulo Arena usando o Stream.io, como "silenciar
            remotamente", "levantar a mão" e controles de áudio individuais. Além disso,
            aprimorei o processo de pré-visualização e seleção de dispositivos, tornando a
            experiência do evento virtual mais interativa e acessível para todos os
            participantes.
        - 
          title: Ambiente de Demonstração
          content: > 
            Para dar suporte à equipe de vendas, projetei e implantei um ambiente sandbox que
            permitiu demonstrações seguras da plataforma. Isso incluiu redefinições automáticas
            de dados e um registrador personalizado para rastrear as etapas de configuração,
            garantindo que cada demonstração começasse com a base limpa e organizada, reduzindo
            o tempo de preparação manual.
        - 
          title: Integração com Google OAuth
          content: > 
            Integrei a autenticação do Google usando NextAuth.js, suportando múltiplas funções
            de usuário e fluxos de integração personalizados. Cada função de usuário exigia
            informações e etapas de registro diferentes, o que tornava o fluxo de autenticação
            mais complexo e desafiador de implementar. Ao mapear e gerenciar esses cenários,
            garanti uma experiência de integração perfeita para todos os tipos de usuário. Isso
            não apenas simplificou o processo de registro, como também levou a um aumento
            mensurável no número de novos usuários cadastrados.
        - 
          title: Quantum League
          content: > 
            Liderei o redesenho e a implementação da maioria das páginas relacionadas à Quantum
            League, uma liga patrocinada que exigiu mudanças profundas na plataforma. Meu
            trabalho incluiu a criação e personalização de novos componentes para combinar com a
            identidade visual da liga, além da adição de recursos como transmissões ao vivo
            diretamente na plataforma e transições de anúncios personalizadas entre o lobby e a
            arena. Todos esses recursos eram totalmente gerenciados pela equipe de marketing por
            meio do painel administrativo, proporcionando maior flexibilidade e promovendo
            visibilidade para os anúncios patrocinados.
        - 
          title: Gerenciador de Filas / Matchmaker
          content: > 
            Desenvolvi o backend para um sistema de matchmaking em tempo real usando Redis e
            Pusher, garantindo que as partidas fossem balanceadas e que o sistema pudesse lidar
            com alto tráfego sem degradação de desempenho. Esse recurso foi submetido a um teste
            de estresse, e os resultados foram impressionantes.
        - 
          title: Melhorias Gerais
          content: > 
            Durante meu tempo na Vanta, atualizei proativamente as principais dependências
            (Ruby, Rails, ActiveAdmin e outras), introduzi recursos de representação para a
            equipe de suporte, otimizei pipelines de CI/CD, refatorei a base de código Next.js
            do Pages Router para o App Router para melhor manutenibilidade, apliquei padrões de
            código com ESLint e configurei ramificações de implantações de visualização no
            Vercel para um feedback mais rápido durante o desenvolvimento.
