          content: > 
           Creating abstractions and refactoring scripts that were previously used via the console and 
           have become tools on the platform.
    - 
      id: sentrel
      product:
        name: Sentrel
        website: 
          url: http://sentrel.com/
          label: sentrel.com
        logo: 
          light: assets/images/sentrel-logo-default.svg
          dark: assets/images/sentrel-logo-negative.svg
      position: Software Engineer
      main_stack: Ruby on Rails, Python
      mode: Remote
      location: 
        city: New York City
        state: NY
        country: USA
      start_date: Sep 2025
      end_date: Dec 2025
      duration: 4 months
      about_the_project: >
        Sentrel is a solution that integrates AI agents into government organizations. The
        product focuses on handling inbound phone calls and, through an AI agent, providing
        support for requested inquiries with access to internal information and the ability to
        respond appropriately, collect relevant data, create requests, send notifications, and
        escalate issues to the responsible departments when necessary.
      about_the_experience: >
        At Sentrel, I worked on the full-stack engineering and development team, actively
        participating in decisions about the application's architecture, including technologies,
        database schema, hosting and monitoring services, as well as coordinating development
        tasks and demands for the team. The application went from scratch to production
        deployment in just over a month.
      main_contributions: 
        - 
          title: Real-time dashboard without reload
          content: > 
            In addition to the main application layout, I developed the core pages with real-time 
            updates using Hotwire. The call dashboard and the live calls transcripts are updated 
            without needing to reload the page.
        - 
          title: RAG capabilities for the agents
          content: > 
            Implemented functionality enabling the agent to consume information using RAG
            (Retrieval-Augmented Generation). The search flow leveraged keywords to improve
            retrieval, delivering highly accurate responses.
        - 
          title: UI componentization
          content: > 
            Using View Components in a Rails monolith, I created a set of reusable
            components to standardize the interface and accelerate development.
        - 
          title: On-demand SMS delivery
          content: > 
            Through Twilio integration, I implemented the ability to send limited
            information such as addresses, phone numbers, emails, and links via SMS.
        - 
          title: Playground and Sandbox environments
          content: > 
            Given that the core of the application operates via phone calls, I developed a
            playground environment where users could interact with the agent via text or place
            calls before production. A sandbox environment was also configured with partner
            service integrations, enabling function calling, knowledge base queries, and the
            use of custom credentials.
        - 
          title: Multi-environment deployment and CI/CD
          content: > 
            Designed and implemented CI/CD workflows for GitHub and Heroku, automating
            deployments. The pipeline included test verification (RSpec), code quality checks
            (RuboCop), vulnerability scanning (Brakeman and Audit), and coverage reporting
            (SimpleCov).
        - 
          title: Usage reports and metrics
          content: > 
            Leveraging application data, I developed metrics visualizations, including
            heatmaps of calls received by hour and day of the week, rankings of the most frequent topics
            discussed, call volume by department, and resolution rates by AI versus escalations,
            with multiple filtering options.
        - 
          title: Multi-agent configuration
          content: > 
            As each client could choose different providers for TTS (Text-to-Speech), LLM
            (Large Language Model), and STT (Speech-to-Text), and each agent had access to its
            own toolset, I designed an orchestration approach to manage these configurations
            reliably and efficiently.
    - 
      id: vanta
      product:
        name: Vanta
        website: 
          url: https://www.vantaesports.com/
          label: vantaesports.com
        logo: 
          light: assets/images/vanta-logo-default.svg
          dark: assets/images/vanta-logo-negative.svg
      position: Full Stack Developer
      main_stack: Ruby on Rails, React
      mode: Remote
      location: 
        city: Boston
        state: MA
        country: USA
      start_date: Apr 2024
      end_date: Aug 2025
      duration: 1 year, 5 months
      about_the_project: >
        Vanta is a platform specialized in e-sports coaching for schools that also promotes
        tournaments across multiple modalities and games within local, state, and national
        leagues. The application provides a virtual environment that enables simultaneous
        streaming of players and their gameplays.
      about_the_experience: >
        At Vanta I worked primarily as a back-end developer with frequent contributions to the
        front-end. It was an incredible experience where I was able to collaborate over time on 
        several important platform features, from integrations with third-party services, 
        improvements to the user experience, development of new features and performance 
        optimizations.
      main_contributions: 
        - 
          title: Verizon Innovative Learning Integration
          content: > 
            I developed an OAuth-like API to securely link user accounts with VIL Integration
            with their Vanta Accounts, enabling exclusive access to leagues sponsored by
            Verizon.
        - 
          title: Check-in System
          content: > 
            I was responsible for implementing the backend logic for the match check-in process,
            which included automated reminders and real-time notifications to users. This system
            significantly reduced the number of forfeits, improving overall engagement and
            reliability of the platform.
        - 
          title: Event Page Redesign
          content: > 
            I was responsible for implementing the new event navigation experience based on
            layouts provided by the design team in Figma. My work focused on translating the
            visual concepts into a fully responsive and intuitive interface, ensuring
            consistency across devices.
        - 
          title: Marketplace
          content: > 
            I built a flexible marketplace module where items and content could be managed via
            YAML files, allowing for rapid updates without code changes. Products are managed by
            the marketing team through the admin dashboard, making it easy to launch new offers.
            The marketplace was integrated with HubSpot for purchase tracking and order
            management, streamlining the sales process for both users and admins.
        - 
          title: Arena Enhancements
          content: > 
            I implemented advanced features in the Arena module using Stream.io, such as ‘remote
            mute’, ‘raise hand’, and individual audio controls. Additionally, I improved the
            device preview and selection process, making the virtual event experience more
            interactive and accessible for all participants.
        - 
          title: Demo Environment
          content: > 
            To support the sales team, I designed and deployed a sandbox environment that
            allowed for safe demonstrations of the platform. This included automated data resets
            and a custom logger to track setup steps, ensuring each demo started from a clean
            state and reducing manual preparation time.
        - 
          title: Google OAuth Integration
          content: > 
            I integrated Google authentication using NextAuth.js, supporting multiple user roles
            and custom onboarding flows. Each user role required different information and
            registration steps, which made the authentication flow more complex and challenging
            to implement. By mapping out and handling these scenarios, I ensured a seamless
            onboarding experience for all user types. This not only simplified the registration
            process but also led to a measurable increase in new user sign-ups.
        - 
          title: Quantum League
          content: > 
            I led the redesign and implementation of most pages related to the Quantum League, a
            sponsored league that required extensive changes to the platform. My work included
            creating and customizing new components to match the league's branding, as well as
            adding features such as live broadcasts directly within the platform and custom ad
            transitions between the lobby and the arena. All these features were fully managed
            by the marketing team through the admin dashboard, providing greater flexibility and
            promoting visibility for the sponsored ads.
        - 
          title: Queue Matchmaker System
          content: > 
            I developed the backend for a real-time matchmaking system using Redis and Pusher,
            ensuring that matches were balanced and that the system could handle high traffic
            without performance degradation. This feature was submitted to a stress test, and
            the results were impressive.
        - 
          title: General Improvements
          content: > 
            Throughout my time at Vanta, I proactively upgraded core dependencies (Ruby, Rails,
            ActiveAdmin, and others), introduced impersonation features for support staff,
            optimized CI/CD pipelines, refactored Next.js codebase from Pages Router to App
            Router, for better maintainability, enforced code standards with ESLint, and set up
            preview deployments branches on Vercel for faster feedback during development.
