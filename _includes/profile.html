<header class="rounded-2xl shadow dark:shadow-none border border-slate-300 dark:border-slate-700 overflow-hidden">
  <!-- Top Section: Identity (Blue Gradient) -->
  <div class="bg-gradient-to-r from-slate-850 to-slate-900 p-8 md:px-10">
    <div class="flex flex-col md:flex-row items-center gap-6 md:gap-8">
      <!-- Avatar -->
      <div class="w-28 h-28 md:w-32 md:h-32 rounded-full  shadow-xl overflow-hidden shrink-0 bg-slate-800">
        <img src="assets/images/lucasgeron.png" alt="Profile Pic" class="w-full h-full object-cover" />
      </div>
      <!-- Info -->
      <div class="flex flex-col items-center justify-between md:items-start text-center md:text-left  w-full">
        <h1 class="text-2xl md:text-3xl font-bold text-white">Lucas Fernando Geron</h1>
        <div class="text-lg md:text-xl text-slate-300 font-medium md:flex md:gap-1">
          <h2>Software Engineer</h2>
          <span class="hidden md:block">&bull;</span>
          <h2>Full Stack Developer</h2>
        </div>
        <p class="text-sm md:text-base text-slate-400 font-light opacity-90 tracking-wide">
          Ruby on Rails &bull; React
        </p>
      </div>
      <!-- Social Icons -->
      <div class="flex md:self-end md:mb-6 justify-center  gap-3 border-slate-100 ">
        <a href="https://linkedin.com/in/lucasgeron" target="_blank"
          class="p-2 bg-slate-800 rounded-lg text-slate-500 hover:text-blue-500 hover:bg-blue-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
            <rect width="4" height="12" x="2" y="9" />
            <circle cx="4" cy="4" r="2" />
          </svg>
        </a>
        <a href="https://github.com/lucasgeron" target="_blank"
          class="p-2 bg-slate-800 rounded-lg text-slate-500 hover:text-black hover:bg-slate-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
            <path d="M9 18c-4.51 2-5-2-7-2" />
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Bottom Section: Contact and Bio -->
  <div
    class="bg-white dark:bg-slate-900 md:bg-gradient-to-r md:from-slate-100 md:to-white md:dark:bg-gradient-to-l md:dark:from-slate-850 md:dark:to-slate-900 p-5 space-y-2.5">

    <!-- Contact Links (Responsive Grid) -->
    <div class="flex flex-col lg:flex-row gap-5 lg:items-center lg:justify-between">
      <!-- Links Container: Mobile(1col) -> Tablet(2col) -> Desktop(Flex Row) -->
      <div class="grid grid-cols-1 md:grid-cols-3 lg:flex lg:flex-row gap-3 w-full lg:w-auto">
        <!-- Phone -->
        <a href="http://wa.me/5546999220095"
          class="flex items-center justify-center md:justify-start gap-2 text-sm bg-white text-slate-600 dark:hover:text-blue-500 hover:text-blue-500 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-200 focus:outline-none dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-500" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
          </svg>
          +55 (46) 9 9922 0095
        </a>
        <!-- Email -->
        <a href="mailto:lucasf.geron@gmail.com"
          class="flex items-center justify-center md:justify-start gap-2 text-sm bg-white text-slate-600 dark:hover:text-blue-500 hover:text-blue-500 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-200 focus:outline-none dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-500" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
          lucasf.geron@gmail.com
        </a>
        <!-- Location -->
        <span
          class="flex items-center justify-center md:justify-start gap-2 text-sm bg-white text-slate-600 dark:hover:text-blue-500 hover:text-blue-500 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-200 focus:outline-none dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-500" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          Florianópolis, SC, Brasil
        </span>
      </div>
    </div>

    <!-- Professional Summary -->
    <div
      class="p-4 bg-white dark:bg-slate-850 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-sm leading-relaxed italic">
      {% t profile.professional_summary %}
    </div>
  </div>
</header>
