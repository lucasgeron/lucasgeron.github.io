<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ " /assets/css/tailwind.css" | prepend: site.baseurl_root }}">
  <link rel="stylesheet" href="{{ " /assets/css/main.css" | prepend: site.baseurl_root }}">
</head>

<body
  class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 antialiased selection:bg-blue-200 selection:text-blue-900 font-sans transition-colors duration-300">
  <div class="min-h-screen py-8 px-4 sm:px-6 md:px-8">
    <div class="max-w-4xl mx-auto space-y-6">
      {{ content }}
    </div>
  </div>
  <script src="{{ " /assets/js/main.js" | prepend: site.baseurl_root }}"></script>
  <script src="{{ " /assets/js/theme.js" | prepend: site.baseurl_root }}"></script>
</body>

</html>
